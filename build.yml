name: Compilar IOC 1

on:
  workflow_dispatch:
  push:
    paths:
      - 'ioc1.zip'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Descomprimir el proyecto
        run: unzip -q -o ioc1.zip -d proyecto

      - name: Aceptar licencias de Android
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Compilar el APK
        working-directory: proyecto
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Renombrar el APK
        run: cp proyecto/app/build/outputs/apk/debug/app-debug.apk IOC1.apk

      - name: Guardar el APK como archivo de la compilación
        uses: actions/upload-artifact@v4
        with:
          name: IOC1-APK
          path: IOC1.apk

      - name: Publicar el APK para descargarlo directamente
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0-${{ github.run_number }}
          name: IOC 1 (compilación ${{ github.run_number }})
          files: IOC1.apk
